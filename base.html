<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}{{ app_name }} – AI Fitness Plan Generator{% endblock %}</title>
  <meta name="description" content="Get a personalised workout and nutrition plan generated by Gemini AI.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b6f23d'/%3E%3Cpath d='M14 26h6v12h-6zM44 26h6v12h-6zM20 22h4v20h-4zM40 22h4v20h-4zM24 30h16v4H24z' fill='%230d1411'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="/" aria-label="{{ app_name }} home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="22" height="22"><path d="M14 26h6v12h-6zM44 26h6v12h-6zM20 22h4v20h-4zM40 22h4v20h-4zM24 30h16v4H24z" fill="currentColor"/></svg>
        </span>
        {{ app_name }}
      </a>
      {% if demo_mode %}
        <span class="pill pill-warn" title="Add GEMINI_API_KEY to .env for full AI plans">Demo mode</span>
      {% else %}
        <span class="pill pill-ok">Gemini connected</span>
      {% endif %}
    </div>
  </header>

  <main>
    {% block body %}{% endblock %}
  </main>

  <footer class="wrap footer">
    <span>{{ app_name }} v{{ version }}</span>
    <span>Built with FastAPI &amp; Google Gemini</span>
  </footer>
</body>
</html>
